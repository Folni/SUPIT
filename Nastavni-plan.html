<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="https://code.jquery.com/jquery-3.7.1.js"></script>
    <script src="https://code.jquery.com/ui/1.13.3/jquery-ui.js"></script>
    <script src="JavaScript/appendages.js"></script>
    <title>Nastavni-plan1</title>
  </head>
  <body>
    <div class="space"></div>
    <div class="title">
      <h1 class="h1-title">Nastavni plan</h1>
    </div>
    <div class="contain">
      <div class="interface">
        <label for="autocomplete">Naziv kolegija: </label>
        <input id="autocomplete" />
      </div>

      <table class="auto-table">
        <thead>
          <tr>
            <th>Kolegij</th>
            <th>Ects</th>
            <th>Sati</th>
            <th>Predavanja</th>
            <th>Vježbe</th>
            <th>Tip</th>
            <th></th>
          </tr>
        </thead>
        <tbody></tbody>
        <tfoot>
          <tr class="table-foot-row">
            <td class="columnKolegij" style="text-align: right">Ukupno</td>
            <td class="columnEcts"></td>
            <td class="columnSati"></td>
            <td class="columnPredavanja"></td>
            <td class="columnVježbe"></td>
            <td class="columnTip"></td>
          </tr>
        </tfoot>
      </table>
    </div>
  </body>
</html>
